name: build deltoid

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: apt-build-${{ runner.os }}

      - name: install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgtk-3-dev libxkbcommon-dev libssl-dev

      - name: install rust toolchain
        uses: dtolnay/rust-action@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-ui/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-ui/Cargo.lock') }}

      - name: build all
        run: make all

      - name: generate readme
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          cat > HOW_TO_USE.txt << 'EOF'
          ================================================================
            DELTOID  —  sober lua executor for linux / chromeos
            build: ${SHORT_SHA}   built: $(date -u '+%Y-%m-%d %H:%M UTC')
          ================================================================

          WHAT YOU NEED
          ----------------------------------------------------------------
          - chromeos with linux (crostini) enabled, OR any debian/ubuntu
          - sober installed via flatpak  (org.vinegarhq.Sober)
          - roblox account

          STEP 1 — install dependencies (one time only)
          ----------------------------------------------------------------
          open your linux terminal and run:

            sudo apt-get update
            sudo apt-get install -y flatpak curl python3

            flatpak remote-add --if-not-exists flathub \
              https://flathub.org/repo/flathub.flatpakrepo

            flatpak install flathub org.vinegarhq.Sober

          STEP 2 — download the release
          ----------------------------------------------------------------
          go to the releases page on github and download:

            libdeltoid.so       <- the injection library  (required)
            deltoid-injector    <- sets up the hook       (required)
            deltoid-ui          <- the script editor      (required)
            init.lua            <- unc environment        (required)

          put all four files in the same folder, e.g.:

            mkdir -p ~/deltoid
            mv ~/Downloads/{libdeltoid.so,deltoid-injector,deltoid-ui,init.lua} ~/deltoid/
            cd ~/deltoid

          STEP 3 — make binaries executable (one time only)
          ----------------------------------------------------------------

            chmod +x deltoid-injector deltoid-ui

          STEP 4 — run the injector  (sets the injection hook)
          ----------------------------------------------------------------

            cd ~/deltoid
            ./deltoid-injector

          you should see:
            [ deltoid ] stealth hook set. launch sober now.

          if you see an error, make sure flatpak is installed and
          org.vinegarhq.Sober is present:
            flatpak list | grep Sober

          STEP 5 — launch sober
          ----------------------------------------------------------------
          after the injector succeeds, start sober normally:

            flatpak run org.vinegarhq.Sober

          OR use the convenience script (switches to OpenGL automatically,
          which is more stable on chromeos):

            #!/bin/bash
            CONFIG="$HOME/.var/app/org.vinegarhq.Sober/config/sober/config.json"
            if [ -f "$CONFIG" ]; then
              python3 -c "
          import json
          with open('$CONFIG') as f: c = json.load(f)
          c['graphics_api'] = 'OpenGL'
          with open('$CONFIG','w') as f: json.dump(c, f, indent=2)
          "
            fi
            flatpak run org.vinegarhq.Sober

          save that as ~/deltoid/launch.sh, then:
            chmod +x ~/deltoid/launch.sh
            ~/deltoid/launch.sh

          STEP 6 — open the ui
          ----------------------------------------------------------------
          while sober/roblox is running, open a second terminal:

            cd ~/deltoid
            ./deltoid-ui

          1. wait for "Injected" status in the top panel
          2. paste your lua script in the editor
          3. click  EXECUTE

          the script will be picked up by the injected library
          within ~200ms and run inside roblox.

          STEP 7 — running scripts via file (no ui)
          ----------------------------------------------------------------
          you can also drop a lua file directly:

            cp myscript.lua /tmp/deltoid_exec.lua

          the injected library polls /tmp/deltoid_exec.lua every 200ms.
          it will execute and delete the file automatically.

          TROUBLESHOOTING
          ----------------------------------------------------------------
          sober not found:
            flatpak list | grep Sober
            -> if missing: flatpak install flathub org.vinegarhq.Sober

          hook not working after injector:
            flatpak override --user --show org.vinegarhq.Sober
            -> should show LD_PRELOAD pointing to libdeltoid.so

          reset all overrides (clean slate):
            flatpak override --user --reset org.vinegarhq.Sober

          ui won't open (missing dependencies):
            sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

          black screen / crash in sober:
            set graphics_api to OpenGL (see step 5 convenience script)

          script not executing:
            check /tmp/deltoid_exec.lua exists after clicking execute
            check sober terminal output for [ deltoid ] log lines

          ================================================================
            deltoid is provided as-is for educational purposes.
            use at your own risk.
          ================================================================
          EOF

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deltoid-${{ github.sha }}
          path: |
            libdeltoid.so
            deltoid-injector
            deltoid-ui
            init.lua
            HOW_TO_USE.txt
          retention-days: 30

      - name: publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libdeltoid.so
            deltoid-injector
            deltoid-ui
            init.lua
            HOW_TO_USE.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
