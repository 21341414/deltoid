name: build deltoid kx

on:
  push:
    branches: ["main"]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: apt-gtk4-${{ runner.os }}

      - name: install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgtk-4-dev libglib2.0-dev

      - name: build libdeltoid.so
        run: |
          gcc -fPIC -shared -O2 -Wall -Wextra \
            injected_lib.c \
            -o libdeltoid.so \
            -ldl -lpthread

      - name: build launcher
        run: |
          gcc -O2 -Wall -Wextra \
            Injector.c \
            -o deltoid_launcher

      - name: build gui
        run: |
          gcc -O2 -Wall -Wextra \
            $(pkg-config --cflags gtk4) \
            deltoidUI.c \
            -o Deltoid_GUI \
            $(pkg-config --libs gtk4)

      - name: generate readme
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          cat > HOW_TO_USE.txt << EOF
DELTOID KX  sober lua executor for linux and chromeos
build ${SHORT_SHA}
built $(date -u '+%Y-%m-%d %H:%M UTC')

what this is
this setup lets you run a lua execution environment inside sober on linux or chromeos.
you use a launcher first, then attach the gui, then execute scripts inside roblox.

what you need
- chromeos with linux enabled or any ubuntu or debian system
- sober installed through flatpak org.vinegarhq.Sober
- a roblox account

step 1 install dependencies one time
open your terminal and run

sudo apt-get update
sudo apt-get install -y flatpak libgtk-4-dev curl python3

then add flathub if you do not have it already

flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

install sober

flatpak install flathub org.vinegarhq.Sober

step 2 download the build
from github releases download these files

libdeltoid.so
deltoid_launcher
Deltoid_GUI
init.lua

put them all in the same folder like this

mkdir -p ~/deltoid
mv ~/Downloads/libdeltoid.so ~/Downloads/deltoid_launcher ~/Downloads/Deltoid_GUI ~/Downloads/init.lua ~/deltoid/
cd ~/deltoid

step 3 make them executable

chmod +x deltoid_launcher Deltoid_GUI

step 4 run the launcher
this sets the hook that sober will load

cd ~/deltoid
./deltoid_launcher

if it works you will see

[ deltoid ] hook set. launch sober now.

if it fails check sober is installed

flatpak list | grep Sober

step 5 launch sober
run sober normally

flatpak run org.vinegarhq.Sober

if you want more stability on chromeos use this

create a file called launch.sh in ~/deltoid and paste

#!/bin/bash
CONFIG="\$HOME/.var/app/org.vinegarhq.Sober/config/sober/config.json"

if [ -f "\$CONFIG" ]; then
python3 - << 'PY'
import json
with open("$CONFIG") as f:
    c = json.load(f)
c["graphics_api"] = "OpenGL"
with open("$CONFIG", "w") as f:
    json.dump(c, f, indent=2)
PY
fi

flatpak run org.vinegarhq.Sober

then run

chmod +x ~/deltoid/launch.sh
~/deltoid/launch.sh

step 6 open the gui
keep sober running then open another terminal

cd ~/deltoid
./Deltoid_GUI

inside the gui

1 click attach and wait until it says attached
2 paste your lua script
3 click execute

your script will run inside roblox shortly after it is detected

step 7 run scripts without gui
you can also drop a file directly

cp myscript.lua /tmp/deltoid_exec.lua

the system checks that file every 200ms
when it finds it it runs it and deletes it

troubleshooting

sober not found
flatpak list | grep Sober
if missing install it again

launcher did nothing
flatpak override --user --show org.vinegarhq.Sober

reset everything
flatpak override --user --reset org.vinegarhq.Sober

gui errors missing gtk
sudo apt-get install -y libgtk-4-dev

black screen or crash
switch graphics_api to OpenGL

scripts not running
check /tmp/deltoid_exec.lua exists
check sober logs for deltoid output

deltoid kx is provided as is for educational use
use it at your own risk
EOF

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deltoid-kx-${{ github.sha }}
          path: |
            libdeltoid.so
            deltoid_launcher
            Deltoid_GUI
            init.lua
            HOW_TO_USE.txt
          retention-days: 30

      - name: publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          body_path: HOW_TO_USE.txt
          files: |
            libdeltoid.so
            deltoid_launcher
            Deltoid_GUI
            init.lua
            HOW_TO_USE.txt
